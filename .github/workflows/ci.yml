name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CLIENT_URL: http://localhost:5173
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stafflow_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/stafflow_test
  DEMO_MODE: "false"
  DEMO_UPLOADS_ENABLED: "false"

jobs:
  static:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Prepare npm workspace
        uses: ./.github/actions/setup
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check

  client-build:
    name: Client types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Prepare npm workspace
        uses: ./.github/actions/setup
      - name: Typecheck
        run: npm --prefix client run typecheck
      - name: Build
        run: npm run build:client

  server-build:
    name: Server types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Prepare npm workspace
        uses: ./.github/actions/setup
      - name: Generate Prisma client
        run: npm exec -- prisma generate
      - name: Typecheck
        run: npm --prefix server run typecheck
      - name: Typecheck seed scripts
        run: npm exec -- tsc -p prisma/tsconfig.json
      - name: Build
        run: npm run build:server

  client-tests:
    name: Client unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Prepare npm workspace
        uses: ./.github/actions/setup
      - name: Test
        run: npm --prefix client run test

  server-tests:
    name: Server unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Prepare npm workspace
        uses: ./.github/actions/setup
      - name: Generate Prisma client
        run: npm exec -- prisma generate
      - name: Test
        run: npm --prefix server run test:unit
      - name: Seed fixture and target guard tests
        run: npm run db:seed:test

  database:
    name: Database integration and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stafflow_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Prepare npm workspace
        uses: ./.github/actions/setup
      - name: Generate Prisma client
        run: npm exec -- prisma generate
      - name: Apply migrations to the fixed CI test database
        run: npm run db:migrate:deploy
      - name: Guarded database integration tests
        run: npm run test:integration
      - name: Seed the fixed CI test database
        run: |
          node --import tsx <<'NODE'
          const { writeFileSync } = require("node:fs");
          const { spawnSync } = require("node:child_process");
          const { targetFingerprint } = require("./prisma/demo/target.ts");
          const database = "postgresql://postgres:postgres@localhost:5432/stafflow_test";
          if (process.env.DATABASE_URL !== database) throw new Error("Unexpected CI database target.");
          writeFileSync(".env.local", `NODE_ENV=test\nDATABASE_URL=${database}\nDIRECT_URL=${database}\nDEMO_MODE=false\nDEMO_UPLOADS_ENABLED=false\n`);
          const result = spawnSync(process.execPath, ["--import", "tsx", "prisma/seed.ts", "--data-only", "--apply", `--target=${targetFingerprint(database)}`], { stdio: "inherit" });
          process.exit(result.status ?? 1);
          NODE
      - name: Database smoke checks
        run: npm run smoke

  # Preserve the existing required check while exposing independent failures.
  quality:
    if: ${{ always() }}
    needs:
      [static, client-build, server-build, client-tests, server-tests, database]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every check to pass
        env:
          CHECK_RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          node -e 'if (!JSON.parse(process.env.CHECK_RESULTS).every(result => result === "success")) process.exit(1)'
